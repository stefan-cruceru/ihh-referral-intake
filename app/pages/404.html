<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Getting Lamplight ready</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff8f0; color: #3b2b22;
    font: 17px/1.6 "Public Sans", system-ui, sans-serif; text-align: center; padding: 16px; }
  p { color: #715d50; margin: 4px 0; }
  a { color: #a0461f; }
  .d { width: 40px; height: 40px; margin: 0 auto 16px; border: 4px solid #fbe3cc; border-top-color: #e39235; border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(1turn); } }
  @media (prefers-reduced-motion: reduce) { .d { animation: none; } }
</style>
</head>
<body>
<div id="box">
  <div class="d"></div>
  <b>Getting Lamplight ready…</b>
  <p>This takes about 20 seconds.</p>
  <p>Preparando Lamplight…</p>
</div>
<script>
  // GitHub Pages shows this page for any path it has no file for. A link into the app (app/...) is
  // answered by the service worker, so install it and load the link again. Anything else is a real 404.
  const base = "/ihh-referral-intake/";
  const gone = () => { document.getElementById("box").innerHTML =
    '<b>That page isn\'t here.</b><p><a href="' + base + '">Go to the Lamplight demo</a></p>'; };
  if (!location.pathname.startsWith(base + "app/") || !("serviceWorker" in navigator)) gone();
  else if (navigator.serviceWorker.controller) {
    // A worker controls this page yet GitHub answered: it stopped working. Drop it and start over,
    // twice at most, so a worker that keeps failing can't loop the tab.
    let tries = 0;
    try { tries = +sessionStorage.getItem("lamplight-heal") || 0; sessionStorage.setItem("lamplight-heal", tries + 1); } catch (e) {}
    if (tries >= 2) document.getElementById("box").innerHTML =
      '<b>The app did not start.</b><p>Close this tab, then <a href="' + base + '">open the demo again</a>.</p>';
    else navigator.serviceWorker.getRegistrations()
      .then((rs) => Promise.all(rs.map((r) => r.unregister()))).then(() => location.reload());
  } else {
    navigator.serviceWorker.addEventListener("message", (e) => { if (e.data === "ready") location.reload(); else gone(); });
    navigator.serviceWorker.register(base + "sw.js", { scope: base, updateViaCache: "none" })
      .then(() => navigator.serviceWorker.ready).then((r) => r.active.postMessage("warm")).catch(gone);
    // Once the worker is installed, a reload is answered by it (its own wait page takes over from there).
    navigator.serviceWorker.ready.then(() => setTimeout(() => location.reload(), 1500));
  }
</script>
</body>
</html>
