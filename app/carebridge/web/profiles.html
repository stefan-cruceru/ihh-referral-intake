<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice patients</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/display.js"></script>
<style>
  /* Layout for this page only. Colors come from app.css tokens. */
  body { margin: 0; background: var(--bg); color: var(--ink, inherit); }
  .pp-top { display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: .8rem 1.2rem; background: var(--panel); border-bottom: 1px solid var(--line); }
  .pp-top a { color: var(--brand); font-weight: 600; text-decoration: none; }
  .pp-wrap { max-width: 1180px; margin: 0 auto; padding: 1.2rem; }
  .pp-note { background: var(--brand-soft, #e3f1f1); border-radius: 12px; padding: .8rem 1rem; margin: .8rem 0 1.2rem; }
  .pp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .8rem; }
  .pp-card { text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 1rem; cursor: pointer; display: grid; gap: .3rem; font: inherit; color: inherit; }
  .pp-card:hover, .pp-card.on { border-color: var(--brand); }
  .pp-card b { font-size: 1.05rem; }
  .pp-muted { color: var(--muted); font-size: .9rem; }
  .pp-detail { margin-top: 1.4rem; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; }
  .pp-box { background: var(--panel); border-radius: 14px; padding: 1rem 1.2rem; border: 1px solid var(--line); }
  .pp-box h2 { margin: 0 0 .6rem; font-size: 1.2rem; }
  .pp-box h3 { margin: 1rem 0 .4rem; font-size: 1rem; }
  .pp-kv { width: 100%; border-collapse: collapse; font-size: .95rem; }
  .pp-kv td { padding: .3rem .3rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  .pp-kv td:first-child { color: var(--muted); width: 38%; }
  .pp-docs { display: grid; gap: .3rem; }
  .pp-docs button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: .45rem .6rem; cursor: pointer; font: inherit; color: inherit; }
  .pp-docs button:hover { border-color: var(--brand); }
  .pp-route { border-radius: 12px; padding: .8rem 1rem; font-weight: 700; margin-bottom: .6rem; }
  .pp-route.likely_no { background: var(--red-soft, #fbe6e4); } .pp-route.needs_info, .pp-route.clinical_check { background: var(--yellow-soft, #fdf1d8); } .pp-route.likely_yes { background: var(--green-soft, #e4f3ea); }
  .pp-flag { border-left: 4px solid var(--line); padding: .25rem 0 .25rem .7rem; margin: .5rem 0; }
  .pp-flag.not_met { border-color: var(--red, #b3261e); } .pp-flag.cant_tell { border-color: var(--yellow, #a86b00); } .pp-flag.met { border-color: var(--green, #2e7d4f); }
  .pp-quote { font-family: Consolas, "Courier New", monospace; background: var(--bg); padding: .1rem .35rem; border-radius: 4px; font-size: .88rem; }
  .pp-link { border: 0; background: none; color: var(--brand); cursor: pointer; padding: 0; font: inherit; text-decoration: underline; }
  .pp-actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .8rem; }
  .pp-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: .6rem 1rem; cursor: pointer; font: inherit; font-weight: 600; color: inherit; }
  .pp-btn.primary { background: var(--brand); color: var(--brand-ink, #fff); border-color: var(--brand); }
  .pp-lang button { border: 1px solid var(--line); background: var(--panel); padding: .35rem .7rem; cursor: pointer; font: inherit; color: inherit; }
  .pp-lang button.on { background: var(--brand); color: var(--brand-ink, #fff); }
  .pp-viewer { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: flex; flex-direction: column; z-index: 30; }
  .pp-viewer[hidden] { display: none; }
  .pp-viewer div { display: flex; justify-content: space-between; align-items: center; color: #fff; padding: .6rem 1rem; gap: .5rem; }
  .pp-viewer img { max-width: 100%; max-height: calc(100% - 60px); margin: 0 auto; background: #fff; object-fit: contain; }
  .pp-viewer .pp-btn { background: transparent; color: #fff; border-color: #fff8; }
  .pp-answer[hidden] { display: none; }
  @media (max-width: 820px) { .pp-detail { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="pp-top">
  <a href="/" id="back"></a>
  <strong id="title"></strong>
  <div class="pp-lang" role="group" aria-label="Language"><button data-lang="en">English</button><button data-lang="es">Español</button></div>
</header>
<main class="pp-wrap">
  <div class="pp-note" id="note"></div>
  <div class="pp-grid" id="grid"></div>
  <div id="detail"></div>
</main>
<div class="pp-viewer" id="viewer" hidden role="dialog" aria-modal="true">
  <div><button class="pp-btn" id="prev">‹</button><span id="vtitle"></span><button class="pp-btn" id="next">›</button><button class="pp-btn" id="vclose"></button></div>
  <img id="vimg" alt="">
</div>
<script>
"use strict";
// Practice patients: the organizers' invented referral packets, one profile each.
const T = {
  back: ["← Back to the referral board", "← Volver al tablero de referidos"],
  title: ["Practice patients", "Pacientes de práctica"],
  note: ["These 10 people are made up. No real patient. Their names, numbers and hospitals are fake, so you can practice safely. Each one has a full faxed packet, like a real referral.",
         "Estas 10 personas son inventadas. Ningún paciente real. Sus nombres, números y hospitales son falsos, para practicar con seguridad. Cada una tiene un paquete de fax completo, como un referido real."],
  years: ["years old", "años"], pages: ["pages", "páginas"],
  who: ["About the patient", "Sobre el paciente"], name: ["Name (made up)", "Nombre (inventado)"],
  age: ["Age", "Edad"], sex: ["Sex", "Sexo"], dob: ["Birth date (made up)", "Fecha de nacimiento (inventada)"],
  mrn: ["Record number (made up)", "Número de expediente (inventado)"], language: ["Language", "Idioma"],
  insurance: ["Insurance", "Seguro"], why: ["Why they need care", "Por qué necesita cuidado"],
  hospital: ["Hospital (made up)", "Hospital (inventado)"], unit: ["Unit", "Unidad"], doctor: ["Doctor", "Médico"],
  cm: ["Case manager (made up)", "Administrador/a de casos (inventado)"], admitted: ["In the hospital since", "En el hospital desde"],
  referred: ["Referral sent", "Referido enviado"], discharge: ["Ready to leave", "Listo para salir"],
  story: ["What the hospital wrote", "Lo que escribió el hospital"], docs: ["What's in the packet", "Qué trae el paquete"],
  page: ["Page", "Página"], close: ["Close", "Cerrar"],
  review: ["What the app points out", "Lo que señala la app"],
  practice: ["Practice review made from the organizers' answer key. Every quote is a real line from that page.",
             "Revisión de práctica hecha con la clave de respuestas de los organizadores. Cada cita es una línea real de esa página."],
  gate_self_care: ["Can take care of themselves", "Puede cuidarse solo/a"], gate_behavior: ["Calm and safe", "Tranquilo/a y seguro/a"],
  met: ["Yes", "Sí"], not_met: ["No", "No"], cant_tell: ["Can't tell", "No se sabe"], not_applicable: ["Does not apply", "No aplica"],
  route_likely_yes: ["Looks like a yes. Check the open items.", "Parece que sí. Revise lo pendiente."],
  route_needs_info: ["We need more from the hospital", "Necesitamos más del hospital"],
  route_clinical_check: ["The clinical line needs to look", "La línea clínica debe revisar"],
  route_likely_no: ["Looks like a no. Sent to the clinical line.", "Parece que no. Se mandó a la línea clínica."],
  missing: ["Missing papers", "Papeles que faltan"], conflicts: ["The papers don't match", "Los papeles no coinciden"],
  ask: ["Ask the hospital", "Pregunte al hospital"],
  show_answer: ["Show the organizers' answer", "Mostrar la respuesta de los organizadores"],
  answer: ["Organizers' answer", "Respuesta de los organizadores"],
  approve: ["approve", "aprobar"], deny: ["deny", "negar"], needs_info: ["needs more information", "falta información"],
  answer_note: ["The app treats rules that need a date as \"can't tell\", because real packets have dates blacked out. These practice packets show dates, so the app can be more careful than the answer.",
                "La app trata las reglas que necesitan una fecha como \"no se sabe\", porque en los paquetes reales las fechas están tachadas. Estos paquetes de práctica muestran fechas, así que la app puede ser más cuidadosa que la respuesta."],
  send: ["Put this patient on the referral board", "Poner a este paciente en el tablero"],
  sent: ["Added to the board. Open the board to work the referral.", "Agregado al tablero. Abra el tablero para trabajar el referido."],
  open_board: ["Open the board", "Abrir el tablero"],
  pdf: ["Print next steps (color PDF)", "Imprimir próximos pasos (PDF a color)"],
  pdf_bw: ["Black and white", "Blanco y negro"],
  pdf_note: ["One or two large-print pages they take with them: clear steps, who to call, where to go, boxes to tick, and a notes box under each step for you to write in. Phone numbers and hours come only from the checked list.",
             "Una o dos hojas en letra grande para llevar: pasos claros, a quién llamar, adónde ir, casillas para marcar y un espacio de notas debajo de cada paso para que usted escriba. Los teléfonos y horarios vienen solo de la lista revisada."],
  pick: ["Pick a patient to see their profile and their pages.", "Escoja un paciente para ver su perfil y sus páginas."],
};
let LANG = "en", LIST = [], CUR = null, VIEW = { pid: null, n: 1, max: 1 };
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const t = (k) => (T[k] ? T[k][LANG === "es" ? 1 : 0] : k);
const api = async (p, o) => { const r = await fetch(p, o); if (!r.ok) throw new Error(r.statusText); return r.json(); };

function chrome() {
  document.documentElement.lang = LANG;
  $("#back").textContent = t("back"); $("#title").textContent = t("title"); $("#note").textContent = t("note");
  $("#vclose").textContent = t("close");
  document.querySelectorAll(".pp-lang button").forEach((b) => b.classList.toggle("on", b.dataset.lang === LANG));
}

function grid() {
  $("#grid").innerHTML = LIST.map((p) => `<button class="pp-card ${CUR && CUR.profile.id === p.id ? "on" : ""}" data-id="${esc(p.id)}">
    <span class="pp-muted">${esc(p.id)} · ${esc(p.hospital)}</span>
    <b>${esc(p.patient.name)}</b>
    <span>${esc(p.patient.age)} ${esc(t("years"))} · ${esc(p.patient.sex)} · ${esc(p.patient.language)}</span>
    <span>${esc(p.diagnosis)}</span>
    <span class="pp-muted">${esc(p.pages)} ${esc(t("pages"))}</span></button>`).join("");
  document.querySelectorAll(".pp-card").forEach((b) => b.addEventListener("click", () => open(b.dataset.id)));
}

async function open(pid) {
  CUR = await api(`/api/profiles/${encodeURIComponent(pid)}`);
  grid();
  detail();
  $("#detail").scrollIntoView({ behavior: "smooth", block: "start" });
}

function detail() {
  if (!CUR) { $("#detail").innerHTML = `<p class="pp-muted" style="margin-top:1rem">${esc(t("pick"))}</p>`; return; }
  const p = CUR.profile, r = CUR.review, pt = p.patient, cm = p.case_manager;
  const row = (k, v) => `<tr><td>${esc(t(k))}</td><td>${esc(v ?? "")}</td></tr>`;
  let left = `<div class="pp-box"><h2>${esc(p.id)} · ${esc(pt.name)}</h2>
    <h3>${esc(t("who"))}</h3><table class="pp-kv">${row("name", pt.name)}${row("age", pt.age)}${row("sex", pt.sex)}${row("dob", pt.dob)}${row("mrn", pt.mrn)}${row("language", pt.language)}${row("insurance", pt.insurance)}${row("why", p.diagnosis)}</table>
    <h3>${esc(t("hospital"))}</h3><table class="pp-kv">${row("hospital", p.hospital)}${row("unit", p.unit)}${row("doctor", p.attending)}${row("cm", `${cm.name}, ${cm.title} · ${cm.phone} · ${cm.email}`)}${row("admitted", p.admitted)}${row("referred", p.referred)}${row("discharge", p.discharge)}</table>
    <h3>${esc(t("story"))}</h3><p>${esc(p.story)}</p>
    <h3>${esc(t("docs"))}</h3><div class="pp-docs">${p.documents.map((d) => `<button data-page="${d.page}">${esc(t("page"))} ${d.page}: ${esc(d.title)}</button>`).join("")}</div></div>`;
  let right = `<div class="pp-box"><h2>${esc(t("review"))}</h2>`;
  if (r) {
    const facts = Object.fromEntries(r.facts.map((f) => [f.id, f]));
    const quote = (id) => facts[id] ? `<div><button class="pp-link" data-page="${facts[id].page}">${esc(t("page"))} ${facts[id].page}</button> <span class="pp-quote">${esc(facts[id].quote)}</span></div>` : "";
    right += `<div class="pp-route ${esc(r.recommendation.code)}">${esc(t("route_" + r.recommendation.code))}</div>
      <p class="pp-muted">${esc(t("practice"))}</p>`;
    for (const g of ["self_care", "behavior"]) right += `<div><b>${esc(t("gate_" + g))}:</b> ${esc(t(r.gates[g].status))}</div>`;
    const flags = r.rules.filter((x) => x.status === "not_met" || (x.status === "cant_tell" && x.fact_ids.length));
    right += flags.map((x) => `<div class="pp-flag ${esc(x.status)}"><b>${esc(x.rule_id)}</b> · ${esc(t(x.status))}<div>${esc(LANG === "es" ? x.explanation_es : x.explanation)}</div>${x.fact_ids.map(quote).join("")}</div>`).join("");
    right += r.diagnoses.filter((d) => d.ineligible).map((d) => `<div class="pp-flag not_met"><b>${esc(d.rule_id)}</b> · ${esc(d.text)}${d.fact_ids.map(quote).join("")}</div>`).join("");
    const miss = r.checklist.filter((c) => c.status === "missing");
    if (miss.length) right += `<h3>${esc(t("missing"))}</h3><ul>${miss.map((c) => `<li>${esc(c.doc_id)}: ${esc(c.text)}</li>`).join("")}</ul>`;
    if (r.conflicts.length) right += `<h3>${esc(t("conflicts"))}</h3>${r.conflicts.map((c) => `<p>${esc(LANG === "es" ? c.description_es : c.description)}</p>`).join("")}`;
    if (r.questions.length) right += `<h3>${esc(t("ask"))}</h3><ul>${r.questions.map((q) => `<li>${esc(q[LANG])}</li>`).join("")}</ul>`;
    right += `<div class="pp-actions"><button class="pp-btn" id="reveal">${esc(t("show_answer"))}</button></div>
      <div class="pp-answer" id="answer" hidden><h3>${esc(t("answer"))}: ${esc(t(r.answer_key_decision))}</h3><p>${esc(LANG === "es" ? r.summary_es : r.summary)}</p><p class="pp-muted">${esc(t("answer_note"))}</p></div>`;
  }
  right += `<div class="pp-actions"><button class="pp-btn primary" id="send">${esc(t("send"))}</button>
    <a class="pp-btn" href="/api/profiles/${encodeURIComponent(p.id)}/handout.pdf?lang=${LANG}" target="_blank" rel="noopener">${esc(t("pdf"))}</a>
    <a class="pp-btn" href="/api/profiles/${encodeURIComponent(p.id)}/handout.pdf?lang=${LANG}&style=bw" target="_blank" rel="noopener">${esc(t("pdf_bw"))}</a></div>
    <p class="pp-muted">${esc(t("pdf_note"))}</p><p id="sent" class="pp-muted"></p></div>`;
  $("#detail").innerHTML = `<div class="pp-detail">${left}${right}</div>`;
  document.querySelectorAll("#detail [data-page]").forEach((b) => b.addEventListener("click", () => show(p.id, Number(b.dataset.page), p.pages)));
  $("#reveal")?.addEventListener("click", () => { $("#answer").hidden = !$("#answer").hidden; });
  $("#send").addEventListener("click", async () => {
    await api(`/api/profiles/${encodeURIComponent(p.id)}/send`, { method: "POST" });
    $("#sent").innerHTML = `${esc(t("sent"))} <a href="/">${esc(t("open_board"))}</a>`;
  });
}

function show(pid, n, max) {
  VIEW = { pid, n, max };
  $("#vtitle").textContent = `${pid} · ${t("page")} ${n} / ${max}`;
  $("#vimg").src = `/api/profiles/${encodeURIComponent(pid)}/pages/${n}.jpg`;
  $("#viewer").hidden = false;
}
$("#prev").addEventListener("click", () => VIEW.n > 1 && show(VIEW.pid, VIEW.n - 1, VIEW.max));
$("#next").addEventListener("click", () => VIEW.n < VIEW.max && show(VIEW.pid, VIEW.n + 1, VIEW.max));
$("#vclose").addEventListener("click", () => ($("#viewer").hidden = true));
document.addEventListener("keydown", (e) => {
  if ($("#viewer").hidden) return;
  if (e.key === "Escape") $("#viewer").hidden = true;
  if (e.key === "ArrowLeft") $("#prev").click();
  if (e.key === "ArrowRight") $("#next").click();
});
document.querySelectorAll(".pp-lang button").forEach((b) => b.addEventListener("click", () => { LANG = b.dataset.lang; window.cbLang?.set(LANG); chrome(); grid(); detail(); }));

(async function boot() {
  try { LANG = window.cbLang?.get() || (await api("/api/state")).lang || "en"; } catch (e) {}
  chrome();
  LIST = (await api("/api/profiles")).profiles;
  grid();
  detail();
  const want = new URLSearchParams(location.search).get("p");
  if (want) open(want);
})();
</script>
</body>
</html>
