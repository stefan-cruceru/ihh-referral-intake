<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IHH Care Bridge</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 23c5-8 19-8 24 0"/><path d="M9 23v4M16 19v8M23 23v4"/><path d="M16 4v3M8.5 7.5l2 2M23.5 7.5l-2 2" stroke="#e0a21f"/></svg>
    </div>
    <div><div class="name">IHH Care Bridge</div><div class="tag" data-i18n="app_tag"></div></div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="referrals" class="on"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h4l1.5 3h5L16 13h4"/><path d="M5.5 5h13L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Z"/></svg><span data-i18n="tab_referrals"></span></button>
    <button role="tab" data-tab="resources"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg><span data-i18n="tab_resources"></span></button>
    <button role="tab" data-tab="staff"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg><span data-i18n="tab_staff"></span></button>
    <button role="tab" data-tab="rules"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3Z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg><span data-i18n="tab_rules"></span></button>
<a class="tab-link" href="/static/profiles.html"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3 3 0 0 1 0 5.6M18 19a5 5 0 0 0-2.5-4.3"/></svg><span data-i18n="tab_profiles"></span></a>
    <button role="tab" data-tab="outbox"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9Z"/><path d="M10 19.5a2 2 0 0 0 4 0"/></svg><span data-i18n="tab_outbox"></span><span class="count hidden" id="outbox-count"></span></button>
    <button role="tab" data-tab="people"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.5A6.5 6.5 0 0 1 21.5 20"/></svg><span data-i18n="tab_people"></span></button>
  </nav>
  <div class="right">
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en">English</button><button data-lang="es">Español</button>
    </div>
    <button class="icon" id="open-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
  </div>
</header>
<div class="privacy-bar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3Z" fill="none" stroke="currentColor" stroke-width="2"/></svg><span data-i18n="privacy"></span></div>

<main>
  <!-- Referrals -->
  <section id="tab-referrals" class="tab on">
    <div class="hero">
      <div>
        <h1 data-i18n="hero_title"></h1>
        <p data-i18n="hero_sub"></p>
      </div>
      <div class="hero-actions">
        <label class="btn primary big" for="file-input" tabindex="0"><span data-i18n="add_packet"></span></label>
        <button class="btn big ghost" id="start-demo" data-i18n="start_demo"></button>
        <input type="file" id="file-input" accept=".pdf,.tif,.tiff,.png,.jpg,.jpeg" hidden>
      </div>
    </div>
    <div id="drop" class="drop" data-i18n="drop_hint"></div>
    <div id="sim" class="sim hidden"></div>
    <div class="board-head">
      <div class="clock"><span data-i18n="clock"></span> <b id="clock-time">–</b>
        <select id="speed"><option value="1" data-i18n="speed_real"></option><option value="60" data-i18n="speed_fast"></option></select>
      </div>
      <div id="stats" class="stats"></div>
    </div>
    <div id="peak" class="peak hidden"></div>
    <div id="queue" class="queue"></div>
    <div class="panel" id="report-panel">
      <div class="row" style="justify-content:space-between"><h3 data-i18n="h_report"></h3>
        <label class="small"><input type="checkbox" id="rep-practice" checked style="width:auto"> <span data-i18n="rep_practice"></span></label></div>
      <div id="report" class="stats"></div>
    </div>
  </section>

  <!-- Resources -->
  <section id="tab-resources" class="tab">
    <div class="narrow">
      <h1 data-i18n="res_title"></h1>
      <p class="muted" data-i18n="res_sub"></p>
      <label class="lbl" data-i18n="res_try"></label>
      <div id="scenarios" class="chips"></div>
      <textarea id="situation" rows="4"></textarea>
      <div id="phi-live" class="phi hidden"></div>
      <div class="row">
        <button class="btn primary" id="find" data-i18n="res_find"></button>
        <button class="btn ghost" id="find-offline" data-i18n="res_no_ai"></button>
      </div>
      <div id="res-out"></div>
    </div>
  </section>

  <!-- Staff -->
  <section id="tab-staff" class="tab">
    <div class="narrow">
      <h1 data-i18n="staff_title"></h1>
      <p class="muted" data-i18n="staff_sub"></p>
      <div class="roles">
        <button class="role on" data-role="lvn"><b data-i18n="role_lvn"></b><span data-i18n="role_lvn_do"></span></button>
        <button class="role" data-role="coord"><b data-i18n="role_coord"></b><span data-i18n="role_coord_do"></span></button>
        <button class="role" data-role="cm"><b data-i18n="role_cm"></b><span data-i18n="role_cm_do"></span></button>
      </div>
      <div id="role-lvn" class="role-panel">
        <label class="lbl" data-i18n="jottings"></label>
        <textarea id="jottings" rows="5"></textarea>
        <div id="phi-jot" class="phi hidden"></div>
        <button class="btn primary" id="make-note" data-i18n="make_note"></button>
        <div id="note-out"></div>
      </div>
      <div id="role-coord" class="role-panel hidden">
        <input id="explain-id" list="rule-ids" placeholder="ADL-2, MOB-4, DOC-6…">
        <datalist id="rule-ids"></datalist>
        <button class="btn primary" id="explain" data-i18n="explain"></button>
        <div id="explain-out"></div>
      </div>
    </div>
  </section>

  <!-- Rules -->
  <section id="tab-rules" class="tab">
    <div class="narrow">
      <h1 data-i18n="tab_rules"></h1>
      <p class="muted" data-i18n="gates_why"></p>
      <input id="rule-search" data-i18n-ph="search_rules">
      <div id="rules-out"></div>
    </div>
  </section>

  <!-- Staff alerts: drafts a person sends from Outlook or Teams -->
  <section id="tab-outbox" class="tab">
    <div class="narrow">
      <h1 data-i18n="outbox_title"></h1>
      <p class="muted" data-i18n="outbox_sub"></p>
      <div class="row">
        <label class="lbl" for="outbox-person" data-i18n="outbox_person"></label>
        <select id="outbox-person" style="width:auto"></select>
        <label class="small"><input type="checkbox" id="outbox-done" style="width:auto"> <span data-i18n="outbox_show_done"></span></label>
      </div>
      <div id="outbox-out"></div>
    </div>
  </section>

  <!-- Who gets alerts -->
  <section id="tab-people" class="tab">
    <div class="narrow">
      <h1 data-i18n="people_title"></h1>
      <p class="muted" data-i18n="people_sub"></p>
      <div id="people-out"></div>
      <h3 data-i18n="people_add"></h3>
      <div class="panel person" id="people-new"></div>
    </div>
  </section>
</main>

<!-- Referral detail -->
<div id="detail" class="drawer hidden" role="dialog" aria-modal="true">
  <div class="drawer-inner" id="detail-body"></div>
</div>

<!-- Page viewer -->
<div id="viewer" class="viewer hidden" role="dialog" aria-modal="true">
  <div class="viewer-bar"><span id="viewer-title"></span><button class="btn ghost" id="viewer-close" data-i18n="close"></button></div>
  <img id="viewer-img" alt="">
</div>

<!-- Settings -->
<div id="settings" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-inner">
    <h2 data-i18n="settings"></h2>
    <h3 data-i18n="key_title"></h3>
    <p class="muted" data-i18n="key_help"></p>
    <div class="row"><span id="key-status" class="pill"></span></div>
    <div class="row"><input id="key-input" type="password" placeholder="sk-ant-…" autocomplete="off"><button class="btn primary" id="key-save" data-i18n="save"></button><button class="btn ghost" id="key-clear" data-i18n="remove"></button></div>
    <h3 data-i18n="provider"></h3>
    <p class="muted" data-i18n="provider_help"></p>
    <div class="row"><select id="provider"><option value="anthropic" data-i18n="provider_anthropic"></option><option value="foundry" data-i18n="provider_foundry"></option></select>
      <input id="foundry-resource" data-i18n-ph="foundry_resource"></div>
    <h3 data-i18n="loop_title"></h3>
    <p class="muted" data-i18n="inbox_help"></p>
    <div class="row"><input id="inbox-dir" data-i18n-ph="inbox_dir" placeholder="C:\Referrals\Inbox"><button class="btn" id="loop-save" data-i18n="save"></button></div>
    <h3 data-i18n="copilot_title"></h3>
    <p class="muted" data-i18n="copilot_help"></p>
    <h3 data-i18n="privacy_title"></h3>
    <p class="muted" data-i18n="privacy_long"></p>
    <p><button class="btn" id="ob-again" data-i18n="ob_again"></button></p>
    <p class="muted small" id="version"></p>
    <div class="row end"><button class="btn" id="settings-close" data-i18n="close"></button></div>
  </div>
</div>
<!-- First-run walkthrough -->
<div id="onboard" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="ob-title">
  <div class="modal-inner onboard" id="onboard-body"></div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
